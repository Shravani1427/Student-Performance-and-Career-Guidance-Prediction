<!DOCTYPE html>
<html lang="en"
      data-page="reports"
      data-role="admin">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports & Analytics | Student Performance</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- Reports CSS -->
    <link rel="stylesheet" href="/css/reports.css">
</head>

<body>

    <!-- =====================================================
         APPLICATION ROOT
    ====================================================== -->
    <div id="app-root"></div>


    <!-- =====================================================
         PAGE CONTENT SOURCE
         layout.js will move this into #page-content
    ====================================================== -->
    <template id="page-content-source">

        <section class="reports-page">

            <!-- =================================================
                 PAGE HEADER
            ================================================== -->
            <div class="reports-header">

                <div>
                    <div class="reports-eyebrow">
                        ADMINISTRATION
                    </div>

                    <h1>
                        Reports & Analytics
                    </h1>

                    <p>
                        Generate and download student, attendance,
                        academic performance and college reports.
                    </p>
                </div>

                <div class="reports-header-icon">
                    ▤
                </div>

            </div>


            <!-- =================================================
                 QUICK SUMMARY
            ================================================== -->
            <div class="report-summary-grid">

                <div class="report-summary-card">
                    <div class="summary-icon students-icon">
                        ♙
                    </div>

                    <div>
                        <span>Total Students</span>
                        <strong id="totalStudents">
                            —
                        </strong>
                    </div>
                </div>


                <div class="report-summary-card">
                    <div class="summary-icon subjects-icon">
                        ▦
                    </div>

                    <div>
                        <span>Total Subjects</span>
                        <strong id="totalSubjects">
                            —
                        </strong>
                    </div>
                </div>


                <div class="report-summary-card">
                    <div class="summary-icon performance-icon">
                        ▥
                    </div>

                    <div>
                        <span>Performance</span>
                        <strong>
                            Academic
                        </strong>
                    </div>
                </div>


                <div class="report-summary-card">
                    <div class="summary-icon attendance-icon">
                        ◔
                    </div>

                    <div>
                        <span>Attendance</span>
                        <strong>
                            Tracking
                        </strong>
                    </div>
                </div>

            </div>


            <!-- =================================================
                 STUDENT REPORT
            ================================================== -->
            <div class="report-section">

                <div class="section-heading">

                    <div class="section-heading-left">
                        <div class="section-icon">
                            ♙
                        </div>

                        <div>
                            <h2>
                                Student Reports
                            </h2>

                            <p>
                                Download complete student information.
                            </p>
                        </div>
                    </div>

                </div>


                <div class="report-card-grid">

                    <div class="report-card">

                        <div class="report-card-icon">
                            📄
                        </div>

                        <div class="report-card-content">

                            <h3>
                                All Student Profiles
                            </h3>

                            <p>
                                Student ID, name, email and department.
                            </p>

                            <button
                                type="button"
                                class="download-btn pdf-btn"
                                id="studentsPdfBtn">

                                Download PDF

                            </button>

                        </div>

                    </div>


                    <div class="report-card">

                        <div class="report-card-icon">
                            📊
                        </div>

                        <div class="report-card-content">

                            <h3>
                                Student Excel Report
                            </h3>

                            <p>
                                Export all registered students into Excel-compatible CSV.
                            </p>

                            <button
                                type="button"
                                class="download-btn excel-btn"
                                id="studentsExcelBtn">

                                Download Excel

                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 ATTENDANCE REPORT
            ================================================== -->
            <div class="report-section">

                <div class="section-heading">

                    <div class="section-heading-left">

                        <div class="section-icon">
                            ◔
                        </div>

                        <div>
                            <h2>
                                Attendance Reports
                            </h2>

                            <p>
                                Generate attendance reports for a selected period.
                            </p>
                        </div>

                    </div>

                </div>


                <div class="filter-box">

                    <div class="filter-group">

                        <label for="attendanceRange">
                            Date Range
                        </label>

                        <select id="attendanceRange">

                            <option value="1m">
                                Last 1 Month
                            </option>

                            <option value="3m">
                                Last 3 Months
                            </option>

                            <option value="6m">
                                Last 6 Months
                            </option>

                            <option value="1y">
                                Last 1 Year
                            </option>

                            <option value="custom">
                                Custom Range
                            </option>

                        </select>

                    </div>


                    <div
                        class="filter-group custom-date"
                        id="customDateGroup">

                        <label for="attendanceStartDate">
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="attendanceStartDate">

                    </div>


                    <div
                        class="filter-group custom-date"
                        id="customEndDateGroup">

                        <label for="attendanceEndDate">
                            End Date
                        </label>

                        <input
                            type="date"
                            id="attendanceEndDate">

                    </div>


                    <div class="filter-actions">

                        <button
                            type="button"
                            class="download-btn pdf-btn"
                            id="attendancePdfBtn">

                            Download PDF

                        </button>

                        <button
                            type="button"
                            class="download-btn excel-btn"
                            id="attendanceExcelBtn">

                            Download Excel

                        </button>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 PERFORMANCE REPORT
            ================================================== -->
            <div class="report-section">

                <div class="section-heading">

                    <div class="section-heading-left">

                        <div class="section-icon">
                            ▥
                        </div>

                        <div>
                            <h2>
                                Academic Performance
                            </h2>

                            <p>
                                Download student marks and grades.
                            </p>
                        </div>

                    </div>

                </div>


                <div class="report-card-grid">

                    <div class="report-card">

                        <div class="report-card-icon">
                            📄
                        </div>

                        <div class="report-card-content">

                            <h3>
                                Performance PDF
                            </h3>

                            <p>
                                Student subjects, marks and grades.
                            </p>

                            <button
                                type="button"
                                class="download-btn pdf-btn"
                                id="performancePdfBtn">

                                Download PDF

                            </button>

                        </div>

                    </div>


                    <div class="report-card">

                        <div class="report-card-icon">
                            📊
                        </div>

                        <div class="report-card-content">

                            <h3>
                                Performance Excel
                            </h3>

                            <p>
                                Export academic performance data.
                            </p>

                            <button
                                type="button"
                                class="download-btn excel-btn"
                                id="performanceExcelBtn">

                                Download Excel

                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 COMPLETE COLLEGE REPORT
            ================================================== -->
            <div class="report-section">

                <div class="section-heading">

                    <div class="section-heading-left">

                        <div class="section-icon">
                            ▤
                        </div>

                        <div>
                            <h2>
                                Complete College Report
                            </h2>

                            <p>
                                Download the complete student directory.
                            </p>
                        </div>

                    </div>

                </div>


                <div class="complete-report-card">

                    <div class="complete-report-info">

                        <div class="complete-report-icon">
                            ◆
                        </div>

                        <div>

                            <h3>
                                Complete College Directory
                            </h3>

                            <p>
                                Includes student ID, name, email and department.
                            </p>

                        </div>

                    </div>


                    <div class="complete-report-buttons">

                        <button
                            type="button"
                            class="download-btn pdf-btn"
                            id="completePdfBtn">

                            Download PDF

                        </button>

                        <button
                            type="button"
                            class="download-btn excel-btn"
                            id="completeExcelBtn">

                            Download Excel

                        </button>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 REPORT INFORMATION
            ================================================== -->
            <div class="report-note">

                <div class="report-note-icon">
                    ✦
                </div>

                <div>

                    <strong>
                        Report Information
                    </strong>

                    <p>
                        Reports are generated directly from the latest
                        student data stored in the database. Newly registered
                        students will appear automatically.
                    </p>

                </div>

            </div>

        </section>

    </template>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- API MUST LOAD FIRST -->
    <script src="/js/api.js"></script>

    <!-- Common layout -->
    <script src="/js/layout.js"></script>

    <!-- Reports page -->
    <script src="/js/reports.js"></script>

</body>

</html>
